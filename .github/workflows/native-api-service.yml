name: Build and Push Docker Image 
on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # env:
    #   HUAWEI_SWR_ENDPOINT: ${{ secrets.HUAWEI_SWR_ENDPOINT }}
    #   HUAWEI_IMAGE: ${{ secrets.HUAWEI_IMAGE }}
    #   HUAWEI_ORGANIZATION: ${{ secrets.HUAWEI_ORGANIZATION }}
    #   ARGOCD_REPO: ${{ secrets.ARGOCD_REPO }}
    #   DEPLOYMENT_PATH: ${{ secrets.DEPLOYMENT_PATH }}
    #   DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    #   GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
    #   GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
    #   BRANCH: ${{ secrets.BRANCH }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core @actions/http-client

      - name: Authenticate with Huawei SWR
        id: login
        env:
          DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD swr.ap-southeast-3.myhuaweicloud.com
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.HUAWEI_SWR_ENDPOINT }}/${{ secrets.HUAWEI_ORGANIZATION }}/${{ secrets.HUAWEI_IMAGE }}:${{ github.run_number }} .

      - name: Push Docker Image to Huawei SWR
        run: |
          docker push ${{ secrets.HUAWEI_SWR_ENDPOINT }}/${{ secrets.HUAWEI_ORGANIZATION }}/${{ secrets.HUAWEI_IMAGE }}:${{ github.run_number }}

      - name: Configure Deploy Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Update ArgoCD Deployment
        run: |
          git clone ${{ secrets.ARGOCD_REPO }}
          cd $(basename ${{ secrets.ARGOCD_REPO }} .git)
          git checkout ${{ secrets.BRANCH }}
          sed -i "s|\(image: \).*|\1${{ secrets.HUAWEI_SWR_ENDPOINT }}/${{ secrets.HUAWEI_ORGANIZATION }}/${{ secrets.HUAWEI_IMAGE }}:${{ github.run_number }}|" ${{ secrets.DEPLOYMENT_PATH }}
          git config user.name "${{ secrets.GIT_USERNAME }}"
          git config user.email "$GIT_EMAIL"
          git add .
          git commit -m "Update image to ${{ secrets.HUAWEI_SWR_ENDPOINT }}/${{ secrets.HUAWEI_ORGANIZATION }}/${{ secrets.HUAWEI_IMAGE }}:${{ github.run_number }}"
          git push origin ${{ secrets.BRANCH }}
