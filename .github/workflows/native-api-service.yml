name: Build and Push Docker Image with OIDC

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
        HUAWEI_SWR_API: ${{ secrets.HUAWEI_SWR_API }}
        HUAWEI_IMAGE: ${{ secrets.HUAWEI_IMAGE }}
        HUAWEI_SWR_ENDPOINT: ${{ secrets.HUAWEI_SWR_ENDPOINT }}
        HUAWEI_ORGANIZATION: ${{ secrets.HUAWEI_ORGANIZATION }}
        ARGOCD_REPO: ${{ secrets.ARGOCD_REPO }}
        DEPLOYMENT_PATH: ${{ secrets.DEPLOYMENT_PATH }}
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        BRANCH: ${{ secrets.BRANCH }}
        dockerHubUser: BQG9INQF0BKVHSNQOLJG
        dockerHubPassword: e054dff1ba4cc985788f9dc974550f1f55ed81c4841a80038fe0b58765395bc6


    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const id_token = await require('@actions/core').getIDToken("testnet-qubetics");
            core.setOutput("id_token", id_token);

      - name: Getting credentials
        id: login
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ap-southeast-3@BQG9INQF0BKVHSNQOLJG --password-stdin swr.ap-southeast-3.myhuaweicloud.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t ${HUAWEI_IMAGE}:${{ github.run_number }} .
      - name: Docker Image Tag 
        run: |
          docker tag ${HUAWEI_IMAGE}:${{ github.run_number }} ${HUAWEI_SWR_ENDPOINT}/${HUAWEI_ORGANIZATION}/${HUAWEI_IMAGE}:${{ github.run_number }} 

      - name: Docker login & Push Docker image to Huawei SWR
        id: login_docker
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ap-southeast-3@BQG9INQF0BKVHSNQOLJG --password-stdin swr.ap-southeast-3.myhuaweicloud.com &&
          docker push ${HUAWEI_SWR_ENDPOINT}/${HUAWEI_ORGANIZATION}/${HUAWEI_IMAGE}:${{ github.run_number }} 
      - name: Configure Deploy Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone ${ARGOCD_REPO}
          cd argocd-qubetics
          git pull origin
          git checkout ${BRANCH}
          sed -i "s|\(image: \).*|\1 ${HUAWEI_SWR_ENDPOINT}/${HUAWEI_ORGANIZATION}/${HUAWEI_IMAGE}:${{ github.run_number }}|" ${DEPLOYMENT_PATH}
          git config user.name ${GIT_USERNAME}
          git config user.email ${GIT_EMAIL}
          git add .
          git commit -m "Update image to  ${HUAWEI_SWR_ENDPOINT}/${HUAWEI_ORGANIZATION}/${HUAWEI_IMAGE}:${{ github.run_number }}"
          git push origin ${BRANCH}
