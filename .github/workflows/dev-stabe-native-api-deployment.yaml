name: '[dev] Deploy native api'

on: 
  push:
    branches: 
      - stable-native-api

jobs:
  dev_deploy_native-api:
    uses: ./.github/workflows/native-api-service.yaml
    with:
      SWR_ORGANIZATION: dev-qubetics
      ARGOCD_BRANCH: dev
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Native-api/native-api.yaml
      HUAWEI_IMAGE: dev-native-api
      DOCKER_USERNAME: ap-southeast-3@HPUAJWWFSLCMD312AZSR
      ENV: ${{ vars.DEV_NATIVE_API_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_NEW }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY_NEW }}
